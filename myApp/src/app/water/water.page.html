<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Water</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="water-content">
  <div class="page">
    <div class="stats">
      <div class="amount">
        <span class="value">{{ cups() }}</span>
        <span class="unit">/{{ goal }} copos</span>
      </div>

      <div class="goal-card">
        <ion-icon name="flag-outline"></ion-icon>
        <span>Meta: {{ goal }} copos · {{ percent() }}%</span>
      </div>
    </div>

    <div class="sea" [style.height.%]="seaHeight()"></div>

    <div class="actions">
      <ion-button
        expand="block"
        shape="round"
        class="drink-btn"
        (click)="addCup()"
      >
        <ion-icon slot="start" name="add-outline"></ion-icon>
        Beber um copo
      </ion-button>
    </div>
  </div>
</ion-content>
