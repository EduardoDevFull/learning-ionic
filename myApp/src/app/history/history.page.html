<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>History</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">History</ion-title>
    </ion-toolbar>
  </ion-header>

  @if (water.entries().length === 0) {
    <p class="empty">No cups logged yet today.</p>
  } @else {
    <ion-list>
      @for (entry of water.entries(); track entry.id) {
        <ion-item>
          <ion-icon slot="start" name="water-outline"></ion-icon>
          <ion-label>{{ entry.time | date: 'shortTime' }}</ion-label>
          <ion-button
            slot="end"
            fill="clear"
            color="danger"
            (click)="water.removeCup(entry.id)"
          >
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-button>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
